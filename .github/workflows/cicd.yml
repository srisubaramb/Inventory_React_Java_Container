name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ----------------------------------------------------
  # JOB 1: Backend CI
  # Build all Spring Boot microservices
  # ----------------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build API Gateway
        run: mvn -f api-gateway/pom.xml clean package

      - name: Build Product Service
        run: mvn -f product-service/pom.xml clean package

      - name: Build Service Registry
        run: mvn -f service-registry/pom.xml clean package

      # Upload backend JARs as CI artifacts
      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            api-gateway/target/*.jar
            product-service/target/*.jar
            service-registry/target/*.jar


  # ----------------------------------------------------
  # JOB 2: Frontend CI
  # Install dependencies and build React application
  # ----------------------------------------------------
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./inventory-frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: ./inventory-frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./inventory-frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: inventory-frontend/dist


  # ----------------------------------------------------
  # JOB 3: Continuous Deployment
  # Runs only after backend and frontend CI succeed
  # ----------------------------------------------------
  deploy:
    needs: [backend-ci, frontend-ci]

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download Backend and Frontend Artifacts
        uses: actions/download-artifact@v4

      - name: Deployment Placeholder
        run: |
          echo "Backend and frontend CI completed successfully."
          echo "Deployment can be added here later."